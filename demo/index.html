<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Potentiel – démo</title>
<meta name="description" content="Maquette interactive : potentiel de travaux de rénovation énergétique d'un logement à partir de son DPE.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#15171C;--muted:#5B6070;--soft:#4A4F5C;--line:#E4E2DA;--paper:#F5F4EF;--card:#FFFFFF;--blue:#2448C9}
*{box-sizing:border-box}
body{margin:0;background:#E9E7E0;color:var(--ink);font-family:Inter,system-ui,sans-serif}
.demo-bar{max-width:440px;margin:0 auto;padding:16px 16px 0}
.demo-bar label{display:block;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.demo-bar select{width:100%;height:44px;border-radius:12px;border:1px solid #CFCCC2;background:#fff;font:inherit;font-size:15px;padding:0 12px;color:var(--ink)}
.demo-bar p{font-size:12px;color:var(--muted);line-height:1.45;margin:8px 0 0}
.app{max-width:440px;margin:16px auto 32px;background:var(--paper);border-radius:28px;padding:22px 18px 28px;display:flex;flex-direction:column;gap:14px}
@media (max-width:480px){.app{border-radius:0;margin:12px 0 0}}
h1,h2,.grotesk{font-family:'Space Grotesk',Inter,sans-serif}
h1,h2{margin:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:12px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.header{display:flex;align-items:center;gap:10px}
.logo{width:38px;height:38px;border-radius:12px;background:var(--ink);display:flex;align-items:center;justify-content:center}
.brand{font-size:21px;font-weight:700;letter-spacing:-.01em;flex-grow:1}
.icon-btn{width:44px;height:44px;border-radius:14px;border:1px solid #E1DFD7;background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 11px;font-size:13px;font-weight:600}
.ok{background:#E7F4EE;color:#0B5E40}
.bad{background:#FDECEC;color:#8A1712}
.row{display:flex;align-items:center;gap:8px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:var(--muted)}
.scale{display:flex;flex-direction:column;gap:6px}
.bar{height:28px;border-radius:7px;display:flex;align-items:center;padding-left:10px;font-family:'Space Grotesk',Inter,sans-serif;font-size:15px;font-weight:700;flex-shrink:0}
.flag{display:flex;align-items:center;gap:5px;border-radius:8px;padding:4px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.flag.now{background:var(--ink);color:#fff}
.flag.after{background:#fff;border:2px solid var(--ink);padding:2px 8px;font-weight:700}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{background:var(--paper);border-radius:14px;padding:11px 12px}
.stat .k{font-size:12px;color:var(--muted)}
.stat .v{font-size:17px;font-weight:700;margin-top:2px}
.status{display:flex;align-items:center;gap:8px;border-radius:12px;padding:10px 12px;font-size:14px;font-weight:600}
.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tab{min-height:64px;border-radius:16px;padding:10px 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;font:inherit;background:#fff;color:var(--ink);border:2px solid #E1DFD7}
.tab[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.tab b{font-size:15px}
.tab span{display:flex;align-items:center;gap:5px;font-size:12px}
.dot{width:10px;height:10px;border-radius:3px}
.tile{display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',Inter,sans-serif;font-weight:700;flex-shrink:0}
.jump{background:var(--ink);color:#fff;border-radius:999px;padding:6px 12px;font-size:14px;font-weight:700;align-self:flex-start}
.budget{background:var(--ink);color:#fff;border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:4px}
.budget .k{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#C9CCD6}
.budget .v{font-size:28px;font-weight:700;letter-spacing:-.01em}
.budget .s{font-size:13px;color:#C9CCD6}
.kpi{border-radius:16px;padding:12px}
.kpi .k{font-size:12px;font-weight:600}.kpi .v{font-size:19px;font-weight:700;margin-top:2px}.kpi .s{font-size:13px}
.badges{display:flex;flex-wrap:wrap;gap:8px}
.badge{display:flex;align-items:center;gap:6px;background:#FFF6D6;color:#5A4300;border:1px solid #F2D877;border-radius:999px;padding:6px 11px;font-size:13px;font-weight:600}
.alert{display:flex;gap:10px;background:#FFF1E3;border:1px solid #F3B37A;border-radius:14px;padding:12px;font-size:13px;line-height:1.45;color:#5C2E00}
.geste{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid #EFEDE6}
.geste .ic{width:28px;height:28px;border-radius:9px;background:#EEF1FB;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.geste .n{font-size:14px;font-weight:600;flex-grow:1}
.geste .q{font-size:13px;color:var(--muted);white-space:nowrap}
.trade .top{display:flex;justify-content:space-between;font-size:14px}
.track{height:10px;border-radius:999px;background:#EDEBE4;overflow:hidden;margin-top:5px}
.fill{height:10px;border-radius:999px;background:var(--blue)}
.lines{max-height:250px;overflow-y:auto;border:1px solid #EFEDE6;border-radius:14px}
.line{display:flex;gap:10px;padding:10px 12px;border-bottom:1px solid #EFEDE6}
.line:last-child{border-bottom:none}
.line .l{font-size:13px;line-height:1.35}.line .m{font-size:12px;color:var(--muted);margin-top:2px}
.line .t{font-size:13px;font-weight:700;white-space:nowrap}
.cta{height:48px;border-radius:14px;border:none;background:var(--ink);color:#fff;font:inherit;font-size:15px;font-weight:600;cursor:pointer}
.photos{border:1px dashed #B9B6AC;align-items:center;justify-content:center;text-align:center;min-height:150px}
footer{font-size:12px;line-height:1.5;color:var(--muted);padding:0 4px}
</style>
</head>

  const bad = txt.includes('interdite');
  return `<div class="status ${bad ? 'bad' : 'ok'}">${I.key}${prefix} : ${esc(txt)}</div>`;
};

const state = { bien: 0, sel: 1 };
const select = document.getElementById('bien');
select.innerHTML = LOGEMENTS.map((l, i) => `<option value="${i}">${esc(l.titre)} · classe ${l.classe}</option>`).join('');
select.addEventListener('change', () => { state.bien = +select.value; state.sel = 1; render(); });

function render() {
  const L = LOGEMENTS[state.bien];
  const P = L.parcours[state.sel];
  const echelle = ['A','B','C','D','E','F','G'].map((c, i) => `
    <div class="row" style="height:28px">
      <div class="bar" style="width:${52 + i*14}px;background:${COUL[c].bg};color:${COUL[c].fg}">${c}</div>
      ${c === L.classe ? `<div class="flag now">${I.left}Aujourd'hui · ${L.ep}</div>` : ''}
      ${c === P.vers ? `<div class="flag after">${I.left}${esc(P.titre)} · ${P.ep}</div>` : ''}
    </div>`).join('');
  const tabs = L.parcours.map((t, i) => `
    <button type="button" class="tab" data-i="${i}" aria-pressed="${i === state.sel}">
      <b>${esc(t.titre)}</b>
      <span><span class="dot" style="background:${COUL[t.vers].bg}"></span>${t.de} → ${t.vers}</span>
    </button>`).join('');
  const sauts = '+' + P.sauts + ' classe' + (P.sauts > 1 ? 's' : '');

  document.getElementById('app').innerHTML = `
  <header class="header">
    <div class="logo">${I.home}</div>
    <div class="brand grotesk">Potentiel</div>
    <button type="button" class="icon-btn" aria-label="Partager le résultat">${I.share}</button>
  </header>

  <section class="card" style="gap:8px">
    <div class="eyebrow">Annonce analysée</div>
    <h1 style="font-size:23px;line-height:1.15">${esc(L.titre)}</h1>
    <div style="font-size:14px;color:var(--soft);line-height:1.4">${esc(L.sous)}</div>
    <div class="row" style="flex-wrap:wrap;margin-top:4px">
      <span class="pill ok">${I.check}DPE officiel retrouvé</span>
      <span class="mono">N° ${esc(L.numero)}</span>
    </div>
  </section>

  <section class="card">
    <div style="display:flex;align-items:baseline;justify-content:space-between">
      <h2 style="font-size:18px">L'étiquette, avant et après</h2>
      <div style="font-size:12px;color:var(--muted)">kWh/m²/an</div>
    </div>
    <div class="scale">${echelle}</div>
    <div class="grid2">
      <div class="stat"><div class="k">Facture énergie actuelle</div><div class="v">${esc(L.facture)}</div></div>
      <div class="stat"><div class="k">En 2027 sans travaux</div><div class="v">Classe ${L.classe2027} · ${L.ep2027}</div></div>
    </div>
    ${status("Aujourd'hui", L.location)}
  </section>

  <section style="display:flex;flex-direction:column;gap:10px">
    <h2 style="font-size:18px;margin:0 4px">Choisissez votre parcours</h2>
    <div class="tabs">${tabs}</div>
  </section>

  <section class="card" style="gap:14px">
    <div style="font-size:15px;color:var(--soft);line-height:1.4">${esc(P.desc)}</div>
    <div class="row" style="gap:12px">
      ${tile(P.de, 70, 38)}${I.arrow}${tile(P.vers, 92, 52)}
      <div style="display:flex;flex-direction:column;gap:6px;margin-left:4px">
        <div class="jump">${sauts}</div>
        <div style="font-size:13px;color:var(--soft)">${L.ep} → ${P.ep} kWh/m²/an</div>
      </div>
    </div>
    <div class="row" style="gap:10px;background:var(--paper);border-radius:14px;padding:10px 12px">
      ${tile(P.vers2027, 34, 18)}
      <div style="font-size:13px;line-height:1.35;color:#2C303A">En 2027, avec le nouveau calcul de l'électricité : classe <strong>${P.vers2027}</strong> (${P.ep2027} kWh/m²/an)</div>
    </div>
    <div class="budget">
      <div class="k">Budget estimé</div>
      <div class="v grotesk">${esc(P.budget)}</div>
      <div class="s">Devis simulé : ${esc(P.total)} TTC, hors aides</div>
    </div>
    <div class="grid2">
      <div class="kpi" style="background:#E7F4EE;color:#0B5E40"><div class="k">Économies</div><div class="v">${esc(P.eco)}</div><div class="s">facture ${esc(P.ecoPct)}</div></div>
      <div class="kpi" style="background:#EEF1FB;color:#1F3A99"><div class="k">Rentabilisé en</div><div class="v">${esc(P.retour)}</div><div class="s">hors aides</div></div>
    </div>
    <div class="badges">${P.badges.map(b => `<div class="badge">${I.star}${esc(b)}</div>`).join('')}</div>
    ${P.alerte ? `<div class="alert">${I.warn}<div>${esc(P.alerte)}</div></div>` : ''}
    ${status('Après travaux', P.location)}
  </section>

  <section class="card" style="gap:10px">
    <h2 style="font-size:18px">Les travaux</h2>
    ${P.gestes.map(g => `<div class="geste"><div class="ic">${I.tool}</div><div class="n">${esc(g.nom)}</div><div class="q">${esc(g.qte)}</div></div>`).join('')}
  </section>

  <section class="card">
    <div>
      <h2 style="font-size:18px">Devis par corps de métier</h2>
      <div style="font-size:12px;color:var(--muted);margin-top:3px">Prix d'artisans simulés · TTC, TVA 5,5 % · hors aides</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:10px">
      ${P.corps.map(c => `<div class="trade"><div class="top"><span style="font-weight:600">${esc(c.nom)}</span><span style="font-weight:700">${esc(c.montant)}</span></div><div class="track"><div class="fill" style="width:${c.pct}%"></div></div></div>`).join('')}
    </div>
    <div style="display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--line);padding-top:10px">
      <span style="font-size:14px;font-weight:600">Total</span>
      <span class="grotesk" style="font-size:22px;font-weight:700">${esc(P.total)}</span>
    </div>
    <div class="eyebrow" style="letter-spacing:.06em">Détail des lignes</div>
    <div class="lines">
      ${P.lignes.map(l => `<div class="line"><div style="flex-grow:1;min-width:0"><div class="l">${esc(l.libelle)}</div><div class="m">${esc(l.corps)} · ${esc(l.calc)}</div></div><div class="t">${esc(l.total)}</div></div>`).join('')}
    </div>
    <button type="button" class="cta">Demander les vrais devis aux artisans</button>
  </section>

  <section class="card photos">
    ${I.img}
    <div style="font-size:15px;font-weight:700">Photos avant / après</div>
    <div style="font-size:13px;color:var(--muted);line-height:1.4">[À venir] Générées à partir des photos de l'annonce.<br>Visualisation non contractuelle.</div>
  </section>

  <footer>Estimation indicative, pas un devis. Étiquettes recalculées avec la méthode officielle 3CL (moteur Open3CL) à partir du DPE enregistré à l'ADEME. Prix d'artisans simulés pour la démonstration ; économies calculées aux prix conventionnels du DPE.</footer>`;

  document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => {
    state.sel = +b.dataset.i; render();
    const t = document.querySelector(`.tab[data-i="${state.sel}"]`); if (t) t.focus();
  }));
}
render();
</script>
</body>
</html>
